<svg xmlns="http://www.w3.org/2000/svg" width="850" height="150" viewBox="0 0 850 150" fill="none">
  <defs>
    <linearGradient id="langsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="langsBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Language Bar Clips -->
    <clipPath id="tsBar"><rect x="0" y="0" width="0" height="8" rx="4"><animate attributeName="width" from="0" to="315" dur="1s" fill="freeze"/></rect></clipPath>
    <clipPath id="jsBar"><rect x="0" y="0" width="0" height="8" rx="4"><animate attributeName="width" from="0" to="200" dur="1s" fill="freeze"/></rect></clipPath>
    <clipPath id="pyBar"><rect x="0" y="0" width="0" height="8" rx="4"><animate attributeName="width" from="0" to="125" dur="1s" fill="freeze"/></rect></clipPath>
    <clipPath id="sqlBar"><rect x="0" y="0" width="0" height="8" rx="4"><animate attributeName="width" from="0" to="95" dur="1s" fill="freeze"/></rect></clipPath>
    <clipPath id="otherBar"><rect x="0" y="0" width="0" height="8" rx="4"><animate attributeName="width" from="0" to="55" dur="1s" fill="freeze"/></rect></clipPath>
  </defs>

  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="848" height="148" rx="10" fill="url(#langsBg)"/>
  <rect x="1" y="1" width="848" height="148" rx="10" fill="none" stroke="url(#langsBorder)" stroke-width="1.2"/>

  <!-- Top Title -->
  <g transform="translate(32, 24)">
    <text x="0" y="14" fill="#64748b" font-size="10.5" font-weight="600" class="mono" letter-spacing="1">CODE COMPOSITION // REPOSITORY LANGUAGE DISTRIBUTION</text>
  </g>

  <!-- Combined Progress Bar Strip -->
  <g transform="translate(32, 54)">
    <!-- Base track -->
    <rect x="0" y="0" width="786" height="10" rx="5" fill="#1e293b"/>
    
    <!-- TypeScript (40%) -->
    <rect x="0" y="0" width="314" height="10" rx="5" fill="#3178c6"/>
    <!-- JavaScript (25%) -->
    <rect x="317" y="0" width="196" height="10" fill="#f7df1e"/>
    <!-- Python (16%) -->
    <rect x="515" y="0" width="125" height="10" fill="#38bdf8"/>
    <!-- SQL / DB (12%) -->
    <rect x="642" y="0" width="94" height="10" fill="#336791"/>
    <!-- Others (7%) -->
    <rect x="738" y="0" width="48" height="10" rx="5" fill="#818cf8"/>
  </g>

  <!-- Legend Items -->
  <g transform="translate(32, 92)">
    <!-- TS -->
    <circle cx="6" cy="12" r="4.5" fill="#3178c6"/>
    <text x="18" y="16" fill="#f1f5f9" font-size="12" font-weight="600" class="mono">TypeScript <tspan fill="#64748b" font-weight="400">40.0%</tspan></text>

    <!-- JS -->
    <circle cx="186" cy="12" r="4.5" fill="#f7df1e"/>
    <text x="198" y="16" fill="#f1f5f9" font-size="12" font-weight="600" class="mono">JavaScript <tspan fill="#64748b" font-weight="400">25.0%</tspan></text>

    <!-- Python -->
    <circle cx="366" cy="12" r="4.5" fill="#38bdf8"/>
    <text x="378" y="16" fill="#f1f5f9" font-size="12" font-weight="600" class="mono">Python <tspan fill="#64748b" font-weight="400">16.0%</tspan></text>

    <!-- SQL -->
    <circle cx="516" cy="12" r="4.5" fill="#336791"/>
    <text x="528" y="16" fill="#f1f5f9" font-size="12" font-weight="600" class="mono">SQL / DB <tspan fill="#64748b" font-weight="400">12.0%</tspan></text>

    <!-- Java & C -->
    <circle cx="666" cy="12" r="4.5" fill="#818cf8"/>
    <text x="678" y="16" fill="#f1f5f9" font-size="12" font-weight="600" class="mono">Java / C <tspan fill="#64748b" font-weight="400">7.0%</tspan></text>
  </g>
</svg>
