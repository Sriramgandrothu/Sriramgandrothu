<svg xmlns="http://www.w3.org/2000/svg" width="850" height="230" viewBox="0 0 850 230" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="85%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="offset" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#30363d" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#30363d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.07"/>
    </pattern>

    <!-- Pulsing Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.15); }
    }
    @keyframes scan {
      0% { transform: translateY(0px); opacity: 0.1; }
      50% { opacity: 0.35; }
      100% { transform: translateY(230px); opacity: 0.1; }
    }
    .term-font {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    .pulse-dot {
      animation: pulse 2s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <!-- Card Background -->
  <rect x="1" y="1" width="848" height="228" rx="12" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="848" height="228" rx="12" fill="url(#grid)"/>
  <rect x="1" y="1" width="848" height="228" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- Top Window Header Bar -->
  <line x1="1" y1="36" x2="849" y2="36" stroke="#1f2937" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="22" cy="18" r="5" fill="#ef4444" opacity="0.85"/>
  <circle cx="38" cy="18" r="5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="54" cy="18" r="5" fill="#10b981" opacity="0.85"/>

  <!-- Terminal Path Breadcrumb -->
  <text x="76" y="22" fill="#64748b" font-size="11" class="term-font">sriram@dev-node: ~/personal/portfolio — zsh</text>

  <!-- Live Status Pill (Top Right) -->
  <g transform="translate(640, 10)">
    <rect x="0" y="0" width="195" height="17" rx="8.5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="10" cy="8.5" r="3.5" fill="#10b981" class="pulse-dot"/>
    <circle cx="10" cy="8.5" r="5.5" fill="#10b981" opacity="0.25" class="pulse-dot"/>
    <text x="20" y="12" fill="#94a3b8" font-size="9.5" font-weight="600" class="term-font" letter-spacing="0.5">SAPTARISHI SOLUTIONS</text>
  </g>

  <!-- Subtitle Tag / Category -->
  <g transform="translate(32, 65)">
    <rect x="0" y="0" width="145" height="18" rx="4" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="8" y="12.5" fill="#38bdf8" font-size="10" font-weight="600" class="term-font" letter-spacing="1">FULL-STACK CRAFTSMAN</text>
  </g>

  <g transform="translate(185, 65)">
    <rect x="0" y="0" width="118" height="18" rx="4" fill="#818cf8" fill-opacity="0.1" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="8" y="12.5" fill="#818cf8" font-size="10" font-weight="600" class="term-font" letter-spacing="1">UI/UX ENTHUSIAST</text>
  </g>

  <g transform="translate(311, 65)">
    <rect x="0" y="0" width="98" height="18" rx="4" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
    <text x="8" y="12.5" fill="#10b981" font-size="10" font-weight="600" class="term-font" letter-spacing="1">BENGALURU, IN</text>
  </g>

  <!-- Main Name Title -->
  <text x="30" y="128" fill="url(#nameGrad)" font-size="34" font-weight="800" class="term-font" letter-spacing="2" filter="url(#glow)">
    SRIRAM GANDROTHU
  </text>

  <!-- Role & Mission Statement -->
  <text x="32" y="156" fill="#94a3b8" font-size="13" class="term-font">
    Engineering scalable web platforms, high-performance backends &amp; intuitive UI architecture.
  </text>

  <!-- Bottom Laser Divider -->
  <line x1="32" y1="174" x2="818" y2="174" stroke="url(#laserGrad)" stroke-width="1.2"/>

  <!-- Live Typing Terminal Line -->
  <g transform="translate(32, 198)">
    <text x="0" y="0" fill="#38bdf8" font-size="12" font-weight="700" class="term-font">&gt;</text>
    <text x="16" y="0" fill="#cbd5e1" font-size="11.5" class="term-font">
      stack: [ Next.js, TypeScript, React, Supabase, Node.js, PostgreSQL, TailwindCSS ]
    </text>
    
    <!-- Animated Blinking Cursor -->
    <rect x="585" y="-11" width="7" height="14" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Right Side Ambient Accent Graphic -->
  <g transform="translate(710, 80)" opacity="0.6">
    <circle cx="45" cy="45" r="35" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
    <circle cx="45" cy="45" r="22" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5"/>
    <polygon points="45,28 58,54 32,54" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
    <circle cx="45" cy="45" r="3" fill="#38bdf8"/>
  </g>
</svg>
